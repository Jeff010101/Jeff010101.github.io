<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">工作负载五方面描述框架</title>
<desc id="desc">工作负载五方面分类图：到达过程、长度、内容与复用、会话与依赖、类别与路由，以及框架之外的三类请求属性。</desc>
<style>
text { font-family: 'Segoe UI', 'Noto Sans SC', sans-serif; fill: #20242a; }
.small { font-size: 18px; } .label { font-size: 20px; font-weight: 600; }
.axis { stroke: #50565f; stroke-width: 2; } .grid { stroke: #d8dde3; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="330" y="35" width="740" height="70" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="3"/>
<text x="700" y="79" class="label" text-anchor="middle"><tspan x="700" dy="0">工作负载：施加于被测系统的请求流</tspan></text>
<line x1="700" y1="105" x2="150" y2="150" stroke="#8a9199" stroke-width="2"/>
<rect x="25" y="150" width="250" height="58" rx="9" fill="#2c6fa820" stroke="#2c6fa8" stroke-width="3"/>
<text x="150" y="186" class="label" text-anchor="middle"><tspan x="150" dy="0">1. 到达过程</tspan></text>
<line x1="150" y1="208" x2="150" y2="242" stroke="#8a9199" stroke-width="2"/>
<rect x="25" y="242" width="250" height="150" rx="9" fill="#fff" stroke="#2c6fa8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="150" y="274" class="small" text-anchor="middle"><tspan x="150" dy="0">速率函数</tspan><tspan x="150" dy="25">变异系数</tspan><tspan x="150" dy="25">间隔分布族</tspan><tspan x="150" dy="25">时间戳粒度</tspan></text>
<line x1="700" y1="105" x2="425" y2="150" stroke="#8a9199" stroke-width="2"/>
<rect x="300" y="150" width="250" height="58" rx="9" fill="#4e8f6220" stroke="#4e8f62" stroke-width="3"/>
<text x="425" y="186" class="label" text-anchor="middle"><tspan x="425" dy="0">2. 长度</tspan></text>
<line x1="425" y1="208" x2="425" y2="242" stroke="#8a9199" stroke-width="2"/>
<rect x="300" y="242" width="250" height="150" rx="9" fill="#fff" stroke="#4e8f62" stroke-width="2" stroke-dasharray="7 5"/>
<text x="425" y="274" class="small" text-anchor="middle"><tspan x="425" dy="0">输入长度分布</tspan><tspan x="425" dy="25">输出长度分布</tspan><tspan x="425" dy="25">两者的相关性</tspan><tspan x="425" dy="25">输出确定方式</tspan></text>
<line x1="700" y1="105" x2="700" y2="150" stroke="#8a9199" stroke-width="2"/>
<rect x="575" y="150" width="250" height="58" rx="9" fill="#c1553b20" stroke="#c1553b" stroke-width="3"/>
<text x="700" y="186" class="label" text-anchor="middle"><tspan x="700" dy="0">3. 内容与复用</tspan></text>
<line x1="700" y1="208" x2="700" y2="242" stroke="#8a9199" stroke-width="2"/>
<rect x="575" y="242" width="250" height="150" rx="9" fill="#fff" stroke="#c1553b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="700" y="274" class="small" text-anchor="middle"><tspan x="700" dy="0">块编号与块大小</tspan><tspan x="700" dy="25">前缀共享结构</tspan><tspan x="700" dy="25">复用率</tspan><tspan x="700" dy="25">测量粒度</tspan></text>
<line x1="700" y1="105" x2="975" y2="150" stroke="#8a9199" stroke-width="2"/>
<rect x="850" y="150" width="250" height="58" rx="9" fill="#8a6ba120" stroke="#8a6ba1" stroke-width="3"/>
<text x="975" y="186" class="label" text-anchor="middle"><tspan x="975" dy="0">4. 会话与依赖</tspan></text>
<line x1="975" y1="208" x2="975" y2="242" stroke="#8a9199" stroke-width="2"/>
<rect x="850" y="242" width="250" height="150" rx="9" fill="#fff" stroke="#8a6ba1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="975" y="274" class="small" text-anchor="middle"><tspan x="975" dy="0">请求间依赖</tspan><tspan x="975" dy="25">等待时间</tspan><tspan x="975" dy="25">开环／闭环</tspan><tspan x="975" dy="25">会话树结构</tspan></text>
<line x1="700" y1="105" x2="1250" y2="150" stroke="#8a9199" stroke-width="2"/>
<rect x="1125" y="150" width="250" height="58" rx="9" fill="#c08a2e20" stroke="#c08a2e" stroke-width="3"/>
<text x="1250" y="186" class="label" text-anchor="middle"><tspan x="1250" dy="0">5. 类别与路由</tspan></text>
<line x1="1250" y1="208" x2="1250" y2="242" stroke="#8a9199" stroke-width="2"/>
<rect x="1125" y="242" width="250" height="150" rx="9" fill="#fff" stroke="#c08a2e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1250" y="274" class="small" text-anchor="middle"><tspan x="1250" dy="0">类别划分</tspan><tspan x="1250" dy="25">各类占比</tspan><tspan x="1250" dy="25">目标模型</tspan><tspan x="1250" dy="25">分级 SLO</tspan></text>
<text x="700" y="443" class="label" text-anchor="middle"><tspan x="700" dy="0">框架之外的请求属性</tspan></text>
<rect x="225" y="480" width="300" height="70" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="3 5"/>
<text x="375" y="522" class="label" text-anchor="middle"><tspan x="375" dy="0">词元的具体取值</tspan></text>
<rect x="550" y="480" width="300" height="70" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="3 5"/>
<text x="700" y="522" class="label" text-anchor="middle"><tspan x="700" dy="0">多模态载荷</tspan></text>
<rect x="875" y="480" width="300" height="70" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="3 5"/>
<text x="1025" y="522" class="label" text-anchor="middle"><tspan x="1025" dy="0">请求生命周期事件</tspan></text>
</svg>