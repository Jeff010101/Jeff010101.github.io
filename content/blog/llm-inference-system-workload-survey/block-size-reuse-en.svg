<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Prefix reuse rate by block size</title>
<desc id="desc">Line chart showing prefix reuse falling from 46.9 percent at block size 16 to 2.8 percent at block size 256 on ACDC offline trace a.</desc>
<style>
text { font-family: 'Segoe UI', 'Noto Sans SC', sans-serif; fill: #20242a; }
.small { font-size: 18px; } .label { font-size: 20px; font-weight: 600; }
.axis { stroke: #50565f; stroke-width: 2; } .grid { stroke: #d8dde3; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#fff"/>
<line class="axis" x1="110" y1="440" x2="810" y2="440"/>
<line class="axis" x1="110" y1="50" x2="110" y2="440"/>
<line class="grid" x1="110" y1="440.0" x2="810" y2="440.0"/>
<text x="95" y="446.0" class="small" text-anchor="end"><tspan x="95" dy="0">0</tspan></text>
<line class="grid" x1="110" y1="362.0" x2="810" y2="362.0"/>
<text x="95" y="368.0" class="small" text-anchor="end"><tspan x="95" dy="0">10</tspan></text>
<line class="grid" x1="110" y1="284.0" x2="810" y2="284.0"/>
<text x="95" y="290.0" class="small" text-anchor="end"><tspan x="95" dy="0">20</tspan></text>
<line class="grid" x1="110" y1="206.0" x2="810" y2="206.0"/>
<text x="95" y="212.0" class="small" text-anchor="end"><tspan x="95" dy="0">30</tspan></text>
<line class="grid" x1="110" y1="128.0" x2="810" y2="128.0"/>
<text x="95" y="134.0" class="small" text-anchor="end"><tspan x="95" dy="0">40</tspan></text>
<line class="grid" x1="110" y1="50.0" x2="810" y2="50.0"/>
<text x="95" y="56.0" class="small" text-anchor="end"><tspan x="95" dy="0">50</tspan></text>
<text x="110.0" y="474" class="small" text-anchor="middle"><tspan x="110.0" dy="0">16</tspan></text>
<text x="250.0" y="474" class="small" text-anchor="middle"><tspan x="250.0" dy="0">32</tspan></text>
<text x="390.0" y="474" class="small" text-anchor="middle"><tspan x="390.0" dy="0">64</tspan></text>
<text x="530.0" y="474" class="small" text-anchor="middle"><tspan x="530.0" dy="0">128</tspan></text>
<text x="670.0" y="474" class="small" text-anchor="middle"><tspan x="670.0" dy="0">256</tspan></text>
<text x="810.0" y="474" class="small" text-anchor="middle"><tspan x="810.0" dy="0">512</tspan></text>
<line x1="560.8" y1="50" x2="560.8" y2="440" stroke="#2c6fa8" stroke-width="2" stroke-dasharray="8 6"/>
<polyline fill="none" stroke="#c1553b" stroke-width="4" points="110.0,74.18 250.0,74.18 390.0,142.82 530.0,142.82 670.0,418.16 810.0,418.16"/>
<circle cx="110.0" cy="74.18" r="6" fill="#c1553b"/>
<circle cx="250.0" cy="74.18" r="6" fill="#c1553b"/>
<circle cx="390.0" cy="142.82" r="6" fill="#c1553b"/>
<circle cx="530.0" cy="142.82" r="6" fill="#c1553b"/>
<circle cx="670.0" cy="418.16" r="6" fill="#c1553b"/>
<circle cx="810.0" cy="418.16" r="6" fill="#c1553b"/>
<text x="460.0" y="520" class="label" text-anchor="middle"><tspan x="460.0" dy="0">Block size (tokens)</tspan></text>
<text x="28" y="245.0" class="label" text-anchor="middle" transform="rotate(-90 28 245.0)">Prefix reuse rate (%)</text>
<line x1="490" y1="78" x2="545" y2="78" stroke="#2c6fa8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="558" y="85" class="small" text-anchor="start"><tspan x="558" dy="0">Block size / median input = 0.5</tspan></text>
</svg>